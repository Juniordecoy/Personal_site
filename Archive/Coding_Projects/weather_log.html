<html>
	<head>
		<title>Changing Form - Data Insights Dashboard</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="../static/assets/css/main.css" />
		<noscript><link rel="stylesheet" href="../static/assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Header -->
			<header id="header">
				<a href="index.html" class="title">Changing Form</a>
				<nav>
					<ul>
						<li><a href="/" class="active">Home</a></li>
						<li><a href="{{url_for('renders')}}" class="active">3D Renderings</a></li>
						<li><a href="{{url_for('two_d_plans')}}" class="active">2D Plans</a></li>
						<li><a href="{{url_for('project_list')}}" class="active">Coding Projects</a></li>
						<li><a href="{{url_for('resume')}}" class="active">Resume</a></li>
						<li><a href="http://github.com/Juniordecoy" class="active">GitHub</a></li>
					</ul>
				</nav>
			</header>

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<section id="main" class="wrapper">
					    <div class="inner">
							<h1 class="major">🌤️ Weather Logbook</h1>

							<form method="POST" style="max-width: 400px; margin: 0 auto; text-align: center">
							  <label for="city">Enter a city:</label>
							  <input type="text" name="city" id="city" required style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
							  <button type="submit" class="button primary" style="margin-top: 1rem;">Check Weather</button>
							</form>

							{% if weather_data %}
							  <div style="text-align: center; margin-top: 2rem;">
								<p>Weather log created for: <strong>{{ weather_data.city }}</strong></p>
							  </div>
							{% endif %}
						</div>
					</section>

			</div>

		<!-- Footer -->
			<footer id="footer" class="wrapper alt">
				<div class="inner">
					<ul class="menu">
						<li>&copy; Changing Form.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a> & E. Junior Rodriguez</li>
					</ul>
				</div>
			</footer>

		<!-- Scripts -->
			<script src="../static/assets/js/jquery.min.js"></script>
			<script src="../static/assets/js/jquery.scrollex.min.js"></script>
			<script src="../static/assets/js/jquery.scrolly.min.js"></script>
			<script src="../static/assets/js/browser.min.js"></script>
			<script src="../static/assets/js/breakpoints.min.js"></script>
			<script src="../static/assets/js/util.js"></script>
			<script src="../static/assets/js/main.js"></script>

	</body>
</html>
